# Modo HTTP — o que o agente autônomo de SRE consome.
# Para uso na IDE não use compose: `docker run -i --rm ...` (o -i é essencial).
services:
  mcp-unified:
    build: .
    image: mcp-unified
    command:
      - --transport
      - streamable-http
      - --profile
      - sre-agent
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
    ports:
      - "8080:8080"
    # Padrão: credenciais em texto plano, suficiente para experimentar.
    env_file:
      - .env
    # Em produção, troque o bloco acima por segredos montados como arquivo.
    # Um `.env` vira variável de ambiente do container, e variável de ambiente
    # aparece em `docker inspect` e no dump de um processo; um segredo montado
    # em /run/secrets, não. Descomente os dois blocos e acrescente
    # `--secrets-dir /run/secrets` ao `command` acima:
    #
    # secrets:
    #   - FULLSTORY_API_KEY
    #   - FULLSTORY_ORG_ID
    #   - DD_API_KEY
    #   - DD_APP_KEY
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/mcp', timeout=3).status < 500 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Perfil opcional: modelo local, para que nenhum dado saia da rede.
  # Suba com:  docker compose --profile local-llm up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:

# O nome de cada segredo precisa bater com o nome da variável: o servidor
# procura /run/secrets/DD_API_KEY, não /run/secrets/datadog-api-key.
# secrets:
#   FULLSTORY_API_KEY:
#     file: ./secrets/FULLSTORY_API_KEY
#   FULLSTORY_ORG_ID:
#     file: ./secrets/FULLSTORY_ORG_ID
#   DD_API_KEY:
#     file: ./secrets/DD_API_KEY
#   DD_APP_KEY:
#     file: ./secrets/DD_APP_KEY
